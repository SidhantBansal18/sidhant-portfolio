                                <div>
                                    <h4 className="text-white font-bold mb-2">Overview</h4>
                                    <p className="text-sm text-gray-300 leading-relaxed">{activeModal.data.fullDesc}</p>
                                </div>
                                <div>
                                    <h4 className="text-white font-bold mb-3">Technical Challenges & Solutions</h4>
                                    <div className="space-y-4">
                                        {activeModal.data.challenges.map((c, i) => (
                                            <div key={i} className="p-3 rounded-md bg-[#0d1117] border gh-border">
                                                <p className="text-xs font-bold text-red-400 mb-1">Challenge</p>
                                                <p className="text-sm text-gray-300 mb-3">{c.problem}</p>
                                                <p className="text-xs font-bold text-green-400 mb-1">Solution</p>
                                                <p className="text-sm text-gray-300">{c.solution}</p>
                                            </div>
                                        ))}
                                    </div>
                                </div>
                                <div>
                                    <h4 className="text-white font-bold mb-2">Expanded Tech Stack</h4>
                                    <div className="flex flex-wrap gap-2">
                                        {activeModal.data.expandedTech.map(t => (
                                            <span key={t} className="text-xs px-2 py-1 rounded-md bg-[#21262d] border gh-border text-blue-300">{t}</span>
                                        ))}
                                    </div>
                                </div>
                            </div>
                        )}
                    </Modal>

                    <Modal 
                        isOpen={activeModal.type === 'experience' && !!activeModal.data} 
                        onClose={() => setActiveModal({ type: null, data: null })}
                        title={activeModal.data?.role}
                    >
                        {activeModal.type === 'experience' && activeModal.data && (
                            <div className="space-y-6">
                                <div className="flex items-center gap-4 mb-6">
                                    <CompanyVisual name={activeModal.data.company} />
                                    <div>
                                        <h4 className="text-xl font-bold text-white">{activeModal.data.company}</h4>
                                        <p className="text-sm gh-text-muted">{activeModal.data.period}</p>
                                    </div>
                                </div>
                                <div>
                                    <h4 className="text-white font-bold mb-2">Company Context</h4>
                                    <p className="text-sm text-gray-300 leading-relaxed">{activeModal.data.companyDesc}</p>
                                </div>
                                <div>
                                    <h4 className="text-white font-bold mb-2">Key Responsibilities</h4>
                                    <ul className="list-disc list-inside text-sm text-gray-300 space-y-2">
                                        {activeModal.data.points.map((p, i) => (
                                            <li key={i} className="leading-relaxed">{p}</li>
                                        ))}
                                    </ul>
                                </div>
                                <div>
                                    <h4 className="text-white font-bold mb-2">Major Achievements</h4>
                                    <ul className="list-disc list-inside text-sm text-gray-300 space-y-2">
                                        {activeModal.data.achievements.map((a, i) => (
                                            <li key={i} className="leading-relaxed">{a}</li>
                                        ))}
                                    </ul>
                                </div>
                            </div>
                        )}
                    </Modal>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
        
        setTimeout(() => {
            window.lucide.createIcons();
        }, 100);
    </script>
</body>
</html>
